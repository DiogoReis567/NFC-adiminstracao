<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestão NFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow"></div>
<div class="waves" aria-hidden="true">
  <svg class="w1" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60 C150 20 450 100 600 60 C750 20 1050 100 1200 60 L1200 120 L0 120Z"/></svg>
  <svg class="w2" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 50 C100 90 500 10 600 50 C700 90 1100 10 1200 50 L1200 120 L0 120Z"/></svg>
</div>

<form id="login">
  <h1>Gestão NFC</h1>
  <p>Entre para continuar.</p>
  <label>Usuário<input id="u" autocomplete="username" autofocus></label>
  <label>Senha
    <div class="pw">
      <input id="p" type="password" autocomplete="current-password">
      <button type="button" id="eye" aria-label="Mostrar senha" title="Mostrar senha"></button>
    </div>
  </label>
  <div id="err"></div>
  <button type="button" id="entrar" class="pri" style="width:100%">Entrar</button>
</form>

<div id="app">
  <header id="topbar"><button id="burger" data-act="menu" aria-label="Abrir menu" aria-expanded="false"></button><span id="tbt"></span></header>
  <div id="scrim" data-act="fechamenu"></div>
  <aside id="nav"></aside>
  <main id="main"></main>
  <div id="mwbox"></div>
  <div id="bellbox"><button type="button" id="bell" data-act="bell" aria-label="Notificações" aria-haspopup="true" aria-expanded="false"></button><span id="bdot" hidden></span><div id="npanel" hidden></div></div>
</div>

<dialog id="cfm"><div id="cfmq" style="margin-bottom:16px"></div><div class="row"><button type="button" data-act="cfmno">Cancelar</button><button type="button" class="pri" data-act="cfmyes">Confirmar</button></div></dialog>
<dialog id="dlg"><form id="form"></form></dialog>
<dialog id="hm"></dialog>
<dialog id="msg"></dialog>
<dialog id="nota"></dialog>
<dialog id="ficha"></dialog>
<dialog id="canc"></dialog>
<dialog id="pwdlg"><div id="pwf">
  <h3 id="pwt"></h3>
  <p id="pwdesc" class="k"></p>
  <label>Senha<div class="pw"><input id="pw1" type="password" autocomplete="new-password"><button type="button" id="pweye" aria-label="Mostrar senha" title="Mostrar senha"></button></div></label>
  <label id="pw2l">Repita a senha<input id="pw2" type="password" autocomplete="new-password"></label>
  <div id="pwa" role="status"></div>
  <div id="pwe" role="alert" style="color:var(--err);font-size:13px;min-height:18px;margin-bottom:6px"></div>
  <div class="row"><button type="button" data-act="pwno">Cancelar</button><button type="button" class="pri" id="pwok">Confirmar</button></div>
</div></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="toast"></div>
<div id="orc"></div>

<script src="app.js"></script>
</body>
</html>
